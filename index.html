<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghép Cặp Từ Vựng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1c33;
    --bg-header:#132743;
    --line:rgba(255,255,255,.08);
    --card:#f6f0da;
    --card-text:#1c3050;
    --accent:#dc7a2b;
    --accent2:#e8a63e;
    --muted:#93a3bd;
    --white:#f2f5fb;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--white);font-family:'Be Vietnam Pro',sans-serif;min-height:100vh;}
  h1,h2,.brand,.tab,.pill,.btn{font-family:'Baloo 2',cursive;}
  header{background:var(--bg-header);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:center;position:relative;}
  .dots{position:absolute;left:20px;display:flex;gap:8px;}
  .dots span{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .dots span:nth-child(1){background:#e2554a;} .dots span:nth-child(2){background:#e6a93b;} .dots span:nth-child(3){background:#57b96b;}
  header h1{margin:0;font-size:20px;letter-spacing:.5px;}

  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;position:relative;}
  input[type=text]{background:transparent;border:1px solid #33507a;color:var(--white);border-radius:12px;padding:12px 16px;font-size:15px;font-family:inherit;}
  #newListName{flex:1;min-width:160px;}
  .icon-btn{background:var(--accent2);border:none;color:#1c2233;width:44px;height:44px;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer;flex:none;}
  .icon-btn:hover{filter:brightness(1.08);}
  .lists-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
  .chip{display:flex;align-items:center;gap:8px;background:#152a49;border:2px solid #23406b;border-radius:14px;padding:10px 14px;cursor:pointer;transition:border-color .15s, background .15s;}
  .chip:hover{border-color:var(--accent2);}
  .chip.active{background:rgba(220,122,43,.18);border-color:var(--accent2);}
  .chip .chip-name{font-family:'Be Vietnam Pro';font-weight:700;font-size:14.5px;color:var(--white);}
  .chip .chip-count{background:rgba(255,255,255,.1);color:var(--muted);font-size:12px;border-radius:999px;padding:2px 9px;font-weight:600;}
  .chip.active .chip-count{background:var(--accent2);color:#1c2233;}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid transparent;font-family:'Be Vietnam Pro';font-weight:600;cursor:pointer;white-space:nowrap;}
  .badge.learned{background:rgba(87,185,107,.15);color:#7bd190;border-color:rgba(87,185,107,.4);}
  .badge.pending{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line);}
  .icon-x{background:none;border:none;color:#e2554a;font-size:15px;cursor:pointer;padding:0 2px;opacity:.7;}
  .icon-x:hover{opacity:1;}

  .list-title{font-size:30px;margin:6px 0 2px;}
  .list-sub{color:var(--muted);margin:0 0 18px;font-family:'Be Vietnam Pro';}

  .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{border-radius:12px;padding:12px 20px;font-size:15px;cursor:pointer;border:1px solid var(--accent2);background:transparent;color:var(--accent2);display:flex;align-items:center;gap:8px;}
  .tab.active{background:var(--accent2);color:#1c2233;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);}}
  .card{background:var(--card);color:var(--card-text);border-radius:16px;min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;font-size:17px;font-weight:600;cursor:pointer;border:3px solid transparent;transition:transform .15s, border-color .15s, opacity .2s, background-color .15s, color .15s;}
  .card.en{color:#b8552a;font-family:'Baloo 2';font-size:22px;font-weight:700;}
  .card:hover{transform:translateY(-2px);}
  .card.selected{border-color:var(--accent);}
  .card.matched{opacity:0;pointer-events:none;transform:scale(.85);}
  .card.correct{background:#3fae5c;border-color:#3fae5c;color:#fff;}
  .card.incorrect{background:#e2554a;border-color:#e2554a;color:#fff;}

  .pager{display:flex;align-items:center;justify-content:space-between;background:#132743;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:20px;flex-wrap:wrap;gap:12px;}
  .btn{background:transparent;border:1px solid #33507a;color:var(--white);border-radius:10px;padding:10px 16px;cursor:pointer;font-size:14px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .toggle-wrap{display:flex;align-items:center;gap:10px;font-family:'Be Vietnam Pro';font-size:14px;color:var(--muted);}
  .switch{width:40px;height:22px;background:#33507a;border-radius:999px;position:relative;cursor:pointer;}
  .switch.on{background:var(--accent2);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .15s;}
  .switch.on .knob{left:20px;}
  .pages{display:flex;gap:6px;}
  .pages button{width:34px;height:34px;border-radius:8px;border:1px solid #33507a;background:transparent;color:var(--white);cursor:pointer;}
  .pages button.active{background:var(--accent2);color:#1c2233;border-color:var(--accent2);}

  .flash-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .flash-card{width:100%;max-width:420px;min-height:220px;background:var(--card);color:var(--card-text);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:22px;font-weight:700;cursor:pointer;font-family:'Baloo 2';}
  .flash-card .vi{font-family:'Be Vietnam Pro';font-weight:500;font-size:17px;color:var(--card-text);}
  .flash-nav{display:flex;gap:14px;align-items:center;}
  .flash-count{color:var(--muted);font-size:14px;}

  .add-form{background:#132743;border:1px solid var(--line);border-radius:16px;padding:22px;max-width:480px;}
  .add-form label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .add-form input{width:100%;margin-bottom:16px;}
  .add-form .btn{background:var(--accent2);color:#1c2233;border:none;font-weight:700;width:100%;padding:13px;font-family:'Baloo 2';font-size:16px;}
  .msg{font-size:14px;margin-top:10px;min-height:18px;}
  .msg.err{color:#f08a7e;}
  .msg.ok{color:#7bd190;}

  .empty{text-align:center;color:var(--muted);padding:40px 10px;}

  .overview-list{display:flex;flex-direction:column;gap:10px;}
  .overview-row{display:flex;align-items:center;gap:16px;background:var(--card);color:var(--card-text);border-radius:14px;padding:14px 18px;}
  .overview-row .ov-en{flex:1;font-family:'Baloo 2';font-weight:700;color:#b8552a;font-size:17px;}
  .overview-row .ov-vi{flex:2;font-size:15px;}
  .overview-row .ov-del{background:none;border:none;color:#c24a3f;font-size:16px;cursor:pointer;opacity:.6;}
  .overview-row .ov-del:hover{opacity:1;}
  .overview-count{color:var(--muted);margin-bottom:12px;font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="dots"><span></span><span></span><span></span></div>
  <h1>Ghép Cặp Từ Vựng</h1>
</header>

<div class="wrap">

  <div class="toolbar">
    <input type="text" id="newListName" placeholder="Tên danh sách mới...">
    <button class="icon-btn" id="createListBtn" title="Tạo danh sách mới">+</button>
  </div>

  <div class="lists-row" id="listsRow"></div>

  <h2 class="list-title" id="listTitle">…</h2>
  <p class="list-sub" id="listSub">0 từ</p>

  <div class="tabs">
    <button class="tab active" data-mode="match">🔗 Ghép cặp</button>
    <button class="tab" data-mode="flash">🗂️ Flashcard</button>
    <button class="tab" data-mode="overview">📋 Toàn bộ</button>
    <button class="tab" data-mode="add">➕ Từ vựng</button>
  </div>

  <div id="content"></div>

</div>

<script>
const API = {
  lists: '/api/lists',
  vocab: '/api/vocabulary',
};

let state = {
  lists: [],
  currentListId: null,
  vocab: [],
  mode: 'match',
  page: 0,
  perPagePairs: 6, // 6 pairs = 12 cards per page
  autoAdvance: true,
  cards: [],
  selected: [],
  feedback: null,
  matchedIds: new Set(),
  flashIndex: 0,
  flashFlipped: false,
};

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Có lỗi xảy ra.');
  return data;
}

async function loadLists() {
  const data = await api(API.lists);
  state.lists = data.items;
  if (!state.currentListId && state.lists.length) {
    state.currentListId = state.lists[0].id;
  }
}

async function loadVocab() {
  if (!state.currentListId) { state.vocab = []; return; }
  const data = await api(`${API.vocab}?list_id=${state.currentListId}`);
  state.vocab = data.items;
}

function currentList() {
  return state.lists.find(l => l.id === state.currentListId);
}

function renderHeader() {
  const l = currentList();
  document.getElementById('listTitle').textContent = l ? l.name : 'Chưa có danh sách nào';
  document.getElementById('listSub').textContent = `${l ? l.total : 0} từ`;
}

function renderListsRow() {
  const row = document.getElementById('listsRow');
  if (!state.lists.length) {
    row.innerHTML = '<div class="empty">Chưa có danh sách nào. Hãy tạo danh sách đầu tiên ở trên.</div>';
    return;
  }
  row.innerHTML = state.lists.map(l => `
    <div class="chip ${l.id === state.currentListId ? 'active' : ''}" data-id="${l.id}" data-action="select" title="Bấm để học danh sách này">
      <span class="chip-name">${escapeHtml(l.name)}</span>
      <span class="chip-count">${l.total} từ</span>
      <span class="badge ${l.is_learned ? 'learned' : 'pending'}" data-action="toggle-learned">${l.is_learned ? '✓ Đã học' : 'Chưa học'}</span>
      <button class="icon-x" data-action="delete" title="Xoá danh sách">✕</button>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Matching game ----------
function buildCards() {
  const startPair = state.page * state.perPagePairs;
  const pagePairs = state.vocab.slice(startPair, startPair + state.perPagePairs);
  let cards = [];
  pagePairs.forEach(v => {
    cards.push({ id: v.id, type: 'en', text: v.english });
    cards.push({ id: v.id, type: 'vi', text: v.vietnamese });
  });
  // shuffle
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  state.cards = cards;
  state.selected = [];
  state.feedback = null;
  state.matchedIds = new Set();
}

function totalPages() {
  return Math.max(1, Math.ceil(state.vocab.length / state.perPagePairs));
}

function renderMatch() {
  const content = document.getElementById('content');
  if (!state.vocab.length) {
    content.innerHTML = '<div class="empty">Danh sách này chưa có từ vựng nào. Hãy thêm từ ở tab "Từ vựng".</div>';
    return;
  }
  const cardsHtml = state.cards.map((c, idx) => {
    const matched = state.matchedIds.has(idx);
    const selected = state.selected.includes(idx);
    const fb = state.feedback;
    const isFeedback = fb && fb.idxs.includes(idx);
    const fbClass = isFeedback ? (fb.correct ? 'correct' : 'incorrect') : '';
    return `<div class="card ${c.type} ${matched ? 'matched' : ''} ${selected && !fbClass ? 'selected' : ''} ${fbClass}" data-idx="${idx}">${escapeHtml(c.text)}</div>`;
  }).join('');

  const pages = totalPages();
  const pageButtons = Array.from({length: pages}, (_, i) => `<button class="${i === state.page ? 'active' : ''}" data-page="${i}">${i+1}</button>`).join('');

  content.innerHTML = `
    <div class="grid" id="matchGrid">${cardsHtml}</div>
    <div class="pager">
      <button class="btn" id="prevPage" ${state.page === 0 ? 'disabled' : ''}>‹ Trang trước</button>
      <div class="toggle-wrap">
        <div class="switch ${state.autoAdvance ? 'on' : ''}" id="autoSwitch"><div class="knob"></div></div>
        Tự động chuyển trang
      </div>
      <button class="btn" id="nextPage" ${state.page >= pages - 1 ? 'disabled' : ''}>Trang sau ›</button>
    </div>
    <div class="pages" style="justify-content:center;margin-top:12px;display:flex;">${pageButtons}</div>
  `;

  document.getElementById('matchGrid').addEventListener('click', onCardClick);
  document.getElementById('prevPage').onclick = () => changePage(state.page - 1);
  document.getElementById('nextPage').onclick = () => changePage(state.page + 1);
  document.getElementById('autoSwitch').onclick = () => { state.autoAdvance = !state.autoAdvance; renderMatch(); };
  content.querySelectorAll('.pages button').forEach(b => {
    b.onclick = () => changePage(parseInt(b.dataset.page, 10));
  });
}

function changePage(p) {
  const pages = totalPages();
  if (p < 0 || p >= pages) return;
  state.page = p;
  buildCards();
  renderMatch();
}

function onCardClick(e) {
  if (state.feedback) return; // wait for current feedback animation to clear
  const el = e.target.closest('.card');
  if (!el) return;
  const idx = parseInt(el.dataset.idx, 10);
  if (state.matchedIds.has(idx) || state.selected.includes(idx)) return;
  state.selected.push(idx);

  if (state.selected.length < 2) {
    renderMatch();
    return;
  }

  const [a, b] = state.selected;
  const isCorrect = state.cards[a].id === state.cards[b].id && state.cards[a].type !== state.cards[b].type;
  state.feedback = { idxs: [a, b], correct: isCorrect };
  renderMatch(); // show green (correct) or red (incorrect) immediately

  setTimeout(() => {
    if (isCorrect) {
      state.matchedIds.add(a);
      state.matchedIds.add(b);
    }
    state.selected = [];
    state.feedback = null;
    renderMatch();

    if (isCorrect && state.matchedIds.size === state.cards.length) {
      setTimeout(() => {
        if (state.autoAdvance && state.page < totalPages() - 1) {
          changePage(state.page + 1);
        }
      }, 400);
    }
  }, 600);
}

// ---------- Flashcards ----------
function renderFlash() {
  const content = document.getElementById('content');
  if (!state.vocab.length) {
    content.innerHTML = '<div class="empty">Danh sách này chưa có từ vựng nào.</div>';
    return;
  }
  if (state.flashIndex >= state.vocab.length) state.flashIndex = 0;
  const v = state.vocab[state.flashIndex];
  content.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-count">${state.flashIndex + 1} / ${state.vocab.length}</div>
      <div class="flash-card" id="flashCard">
        ${state.flashFlipped ? `<span class="vi">${escapeHtml(v.vietnamese)}</span>` : escapeHtml(v.english)}
      </div>
      <div class="flash-nav">
        <button class="btn" id="flashPrev">‹ Trước</button>
        <button class="btn" id="flashFlip">↺ Lật thẻ</button>
        <button class="btn" id="flashNext">Sau ›</button>
      </div>
    </div>
  `;
  document.getElementById('flashCard').onclick = () => { state.flashFlipped = !state.flashFlipped; renderFlash(); };
  document.getElementById('flashFlip').onclick = () => { state.flashFlipped = !state.flashFlipped; renderFlash(); };
  document.getElementById('flashPrev').onclick = () => { state.flashIndex = (state.flashIndex - 1 + state.vocab.length) % state.vocab.length; state.flashFlipped = false; renderFlash(); };
  document.getElementById('flashNext').onclick = () => { state.flashIndex = (state.flashIndex + 1) % state.vocab.length; state.flashFlipped = false; renderFlash(); };
}

// ---------- Overview (view all words in this list) ----------
function renderOverview() {
  const content = document.getElementById('content');
  if (!state.vocab.length) {
    content.innerHTML = '<div class="empty">Danh sách này chưa có từ vựng nào.</div>';
    return;
  }
  const rows = state.vocab.map(v => `
    <div class="overview-row" data-id="${v.id}">
      <div class="ov-en">${escapeHtml(v.english)}</div>
      <div class="ov-vi">${escapeHtml(v.vietnamese)}</div>
      <button class="ov-del" data-action="delete-word" title="Xoá từ này">✕</button>
    </div>
  `).join('');
  content.innerHTML = `
    <div class="overview-count">Tổng cộng ${state.vocab.length} từ trong danh sách này</div>
    <div class="overview-list">${rows}</div>
  `;
  content.querySelectorAll('[data-action="delete-word"]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.closest('.overview-row').dataset.id;
      if (!confirm('Xoá từ này khỏi danh sách?')) return;
      await api(`${API.vocab}/${id}`, { method: 'DELETE' });
      await loadLists();
      await loadVocab();
      renderListsRow();
      renderHeader();
      renderOverview();
    };
  });
}

// ---------- Add vocabulary ----------
function renderAdd() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="add-form">
      <label>Từ tiếng Anh</label>
      <input type="text" id="addEn" placeholder="Ví dụ: luggage">
      <label>Nghĩa tiếng Việt</label>
      <input type="text" id="addVi" placeholder="Ví dụ: hành lý">
      <button class="btn" id="addSubmit">Thêm vào danh sách</button>
      <div class="msg" id="addMsg"></div>
    </div>
  `;
  document.getElementById('addSubmit').onclick = async () => {
    const en = document.getElementById('addEn').value;
    const vi = document.getElementById('addVi').value;
    const msg = document.getElementById('addMsg');
    msg.textContent = '';
    msg.className = 'msg';
    try {
      await api(API.vocab, {
        method: 'POST',
        body: JSON.stringify({ english: en, vietnamese: vi, list_id: state.currentListId }),
      });
      msg.textContent = 'Đã thêm từ vựng!';
      msg.className = 'msg ok';
      document.getElementById('addEn').value = '';
      document.getElementById('addVi').value = '';
      await loadLists();
      await loadVocab();
      renderHeader();
      renderListsRow();
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg err';
    }
  };
}

function renderMode() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === state.mode));
  if (state.mode === 'match') { state.page = 0; buildCards(); renderMatch(); }
  else if (state.mode === 'flash') { state.flashIndex = 0; state.flashFlipped = false; renderFlash(); }
  else if (state.mode === 'overview') renderOverview();
  else if (state.mode === 'add') renderAdd();
}

async function refreshAll() {
  await loadLists();
  await loadVocab();
  renderHeader();
  renderListsRow();
  renderMode();
}

async function switchList(id) {
  state.currentListId = id;
  await loadVocab();
  renderHeader();
  renderListsRow();
  renderMode();
}

// ---------- events ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => { state.mode = tab.dataset.mode; renderMode(); });
});

document.getElementById('listsRow').addEventListener('click', async (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const id = parseInt(chip.dataset.id, 10);
  const action = e.target.closest('[data-action]')?.dataset.action;

  if (action === 'toggle-learned') {
    e.stopPropagation();
    const list = state.lists.find(l => l.id === id);
    await api(`${API.lists}/${id}`, { method: 'PATCH', body: JSON.stringify({ is_learned: !list.is_learned }) });
    await loadLists();
    renderListsRow();
    return;
  }
  if (action === 'delete') {
    e.stopPropagation();
    if (!confirm('Xoá danh sách này và toàn bộ từ vựng trong đó?')) return;
    try {
      await api(`${API.lists}/${id}`, { method: 'DELETE' });
      if (id === state.currentListId) state.currentListId = null;
      await loadLists();
      await loadVocab();
      renderHeader();
      renderListsRow();
      renderMode();
    } catch (err) {
      alert(err.message);
    }
    return;
  }
  if (id !== state.currentListId) {
    await switchList(id);
  }
});

document.getElementById('createListBtn').addEventListener('click', async () => {
  const input = document.getElementById('newListName');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  try {
    const data = await api(API.lists, { method: 'POST', body: JSON.stringify({ name }) });
    input.value = '';
    await loadLists();
    await switchList(data.item.id);
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById('newListName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('createListBtn').click();
});

refreshAll();
</script>
</body>
</html>
